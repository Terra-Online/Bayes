name = "oem-backend"
main = "src/index.ts"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

[[routes]]
pattern = "api.opendfieldmap.org/*"
zone_name = "opendfieldmap.org"

[placement]
mode = "smart"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "oem-db"
database_id = "9ba2f958-0e96-48e8-9049-57ce712b5faf"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UGC_BUCKET"
bucket_name = "opendfieldmap-ugc"

[[durable_objects.bindings]]
name = "PROGRESS_USER_DO"
class_name = "ProgressUserDO"

[[durable_objects.bindings]]
name = "PROGRESS_STATS_DO"
class_name = "ProgressStatsDO"

[[migrations]]
tag = "v1_progress_bitmap_sync"
new_sqlite_classes = ["ProgressUserDO", "ProgressStatsDO"]

[triggers]
crons = ["*/1 * * * *"]

[env.local]

[[env.local.d1_databases]]
binding = "DB"
database_name = "oem-db"
database_id = "9ba2f958-0e96-48e8-9049-57ce712b5faf"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "UGC_BUCKET"
bucket_name = "opendfieldmap-ugc"

[[env.local.durable_objects.bindings]]
name = "PROGRESS_USER_DO"
class_name = "ProgressUserDO"

[[env.local.durable_objects.bindings]]
name = "PROGRESS_STATS_DO"
class_name = "ProgressStatsDO"
